<!doctype html>
<html class="landing" lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#080d20" />
    <title>BODA | PS4 EXPERIENCE</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Original execution structure preserved -->

    <div id="brand"><b>BODA</b></div>

    <div class="shell">
      <img class="meme" src="meme.png" alt="" />

      <main class="panel">
        <div class="panel-top">
          <span class="live-dot"></span>
          <span>PLAYSTATION 4</span>
          <span class="version-tag">BODA SYSTEM</span>
        </div>

        <p class="lede">PS4 FIRMWARE 12.00 &ndash; 14.02</p>

        <form class="pick" id="pick">
          <label class="opt">
            <input type="radio" name="payload" value="hen" />
            <span>PS4-HEN</span>
          </label>

          <label class="opt">
            <input type="radio" name="payload" value="goldhen" checked />
            <span>GoldHEN</span>
          </label>

          <label class="opt opt-auto">
            <input type="checkbox" id="auto" checked />
            <span>AUTOSTART</span>
          </label>

          <button class="btn" type="submit">
            <span>START</span>
            <span class="btn-icon">›</span>
          </button>

          <p class="count" id="count"></p>
          <p class="count" id="cache" aria-live="polite"></p>
        </form>
      </main>
    </div>

    <p class="byline">BODA • PS4 JAILBREAK EXPERIENCE</p>

    <script src="launch.js"></script>
  </body>
</html>
